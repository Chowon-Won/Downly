name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma (si hay secretos)
        env:
          KEYSTORE_B64: ${{ secrets.DOWNLY_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/downly.jks"
            echo "DOWNLY_KEYSTORE_PATH=$RUNNER_TEMP/downly.jks" >> "$GITHUB_ENV"
          else
            echo "Sin keystore: se firmará con clave de depuración"
          fi

      - name: Compilar APK
        env:
          DOWNLY_VERSION_CODE: ${{ github.run_number }}
          DOWNLY_KEYSTORE_PASSWORD: ${{ secrets.DOWNLY_KEYSTORE_PASSWORD }}
          DOWNLY_KEY_ALIAS: ${{ secrets.DOWNLY_KEY_ALIAS }}
          DOWNLY_KEY_PASSWORD: ${{ secrets.DOWNLY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renombrar APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed -e 's/^app-/Downly-/' -e 's/-release//')
            cp "$f" "out/$n"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Downly-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Publicar en Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Downly 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **¿Cuál descargo?**
            - `Downly-arm64-v8a.apk` → la mayoría de móviles actuales (recomendado)
            - `Downly-armeabi-v7a.apk` → móviles antiguos de 32 bits
            - `Downly-universal.apk` → si no sabes cuál; funciona en todos (más pesado)
          files: out/*.apk
